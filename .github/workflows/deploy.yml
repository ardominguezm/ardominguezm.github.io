name: Deploy website to GitHub Pages

env:
  WC_HUGO_VERSION: '0.152.2'
  NODE_VERSION: '20'

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1️⃣ Node
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # 2️⃣ Install pnpm
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    # 3️⃣ Install Tailwind CLI + deps WITHOUT frozen lockfile
    - name: Install Tailwind dependencies
      run: |
        if [ -f "package.json" ]; then
          echo "Installing Tailwind dependencies (no frozen lockfile)..."
          pnpm install --no-frozen-lockfile
        fi

    # 4️⃣ Setup Hugo
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ env.WC_HUGO_VERSION }}
        extended: true

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5

    # 5️⃣ Build Hugo (Tailwind will run automatically)
    - name: Build with Hugo
      env:
        HUGO_ENVIRONMENT: production
      run: |
        hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

    # 6️⃣ Pagefind (optional)
    - name: Build search index
      run: |
        if [ -f "package.json" ] && grep -q "pagefind" package.json; then
          pnpm dlx pagefind --source "public"
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./public

  deploy:
    if: github.repository_owner != 'HugoBlox'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

